  <style>
    :root {
      --bg:#07111f; --bg2:#0b1020; --text:#f8fbff; --muted:#b8c5d9;
      --card:rgba(255,255,255,.075); --border:rgba(255,255,255,.14);
      --blue:#38bdf8; --violet:#8b5cf6; --pink:#ec4899; --green:#22c55e;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at 10% 8%, rgba(56,189,248,.15), transparent 32%),
                  linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      overflow-x:hidden;
    }
    .page { width:min(1180px, calc(100% - 36px)); margin:0 auto; }
    .nav { padding:20px 0; display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(18px); }
    .brand { display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
    .brand-mark { width:45px; height:45px; border-radius:15px; display:grid; place-items:center; font-weight:950; background:linear-gradient(135deg, var(--blue), var(--violet)); }
    
    .section-head { text-align:center; margin: 40px 0; }
    .section-head h1 { font-size: clamp(34px, 5vw, 58px); letter-spacing:-2px; margin:0; }

    .tool-panel { border-radius:32px; border:1px solid var(--border); background:rgba(255,255,255,0.05); backdrop-filter:blur(14px); padding:40px; }
    
    /* منطقة الرفع */
    .upload-area { 
      border: 2px dashed var(--border); border-radius: 24px; padding: 60px 20px; 
      text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02);
      margin-bottom: 20px;
    }
    .upload-area:hover { border-color: var(--blue); background: rgba(56,189,248,0.05); }
    .upload-area i { font-size: 50px; display: block; margin-bottom: 15px; font-style: normal; }

    .results-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 34px; }
    .res-box { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 22px; padding: 22px; }
    .res-box header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .res-box h3 { margin:0; font-size: 13px; color: var(--blue); text-transform: uppercase; letter-spacing: 1px; font-weight: 950; }

    .copy-btn{
  background: rgba(56,189,248,.12);
  border:1px solid rgba(56,189,248,.35);
  color:#7dd3fc;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  transition:.2s;
}

.copy-btn:hover{
  background: rgba(56,189,248,.2);
  transform:translateY(-1px);
}

#languageSelect{
  background: rgba(255,255,255,.06);
  color: #fff;
  border:1px solid var(--border);
  backdrop-filter: blur(12px);
}

#languageSelect option{
  background:#111827;
  color:#f8fbff;
}
    textarea { 
      width: 100%; height: 240px; background: transparent; border: 0; color: var(--muted); 
      resize: none; outline: none; font-family: inherit; font-size: 15px; line-height: 1.7;
      white-space: pre-wrap; overflow-y: auto;
    }

    /* [3] تعديل شاشة الترقية: تظهر بذكاء دون إخفاء النتائج */
    .upgrade-card { display: none; text-align: center; padding: 40px 20px; border-radius: 24px; background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); animation: fadeInUp 0.6s ease; margin-top: 20px; }
    .royal-circle {
      width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--blue), var(--violet), var(--pink));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; color: #fff; font-weight: 950; border: 6px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 40px rgba(56,189,248,0.3); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .royal-circle:hover { transform: scale(1.05); }

    .gradient-text { background: linear-gradient(90deg, #7dd3fc, #c4b5fd, #f9a8d4); -webkit-background-clip: text; color: transparent; }
    [dir="rtl"] .res-box { text-align: right; }
    [dir="rtl"] textarea { direction: rtl; }
    @media (max-width: 850px) { .results-container { grid-template-columns: 1fr; } }
    
    #loader { display:none; position:fixed; inset:0; background:rgba(7,17,31,0.85); z-index:100; place-items:center; backdrop-filter:blur(8px); }
    .spinner { width:50px; height:50px; border:4px solid var(--blue); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>

        <div class="res-box">

                <button onclick="copyToClipboard('translatedResult')" class="copy-btn">📋 Copy</button>
                
                <select id="targetLanguage" style="background:var(--bg); color:var(--pink); border:1px solid var(--border); border-radius:8px; font-weight:bold; padding: 6px 10px;" onchange="executeTranslation()">

          </header>

        </div>
      </div>
    </div>
  </main>
</div>

    // --- بداية النظام اليومي للمحاولات ---
    const getUsageData = () => {
        const today = new Date().toDateString(); // يحصل على تاريخ اليوم (مثل: Mon Jun 01 2026)
        let data = JSON.parse(localStorage.getItem('br_usage_data')) || { date: today, count: 0 };
        
        // تصفير العداد التلقائي إذا بدأ يوم جديد
        if (data.date !== today) {
            data = { date: today, count: 0 };
            localStorage.setItem('br_usage_data', JSON.stringify(data));
        }
        return data;
    };
    let usageData = getUsageData();
    // --- نهاية النظام اليومي ---

    function init() {
        const savedLang = localStorage.getItem('brimagineLanguage') || 'en';
        document.getElementById('languageSelect').value = savedLang;
        setLanguage(savedLang);
        checkUsageLimit();
      // Drag & Drop
    const dz = document.getElementById('dropZone');

    dz.ondragover = (e) => {
      e.preventDefault();
      dz.style.borderColor = 'var(--blue)';
    };

    dz.ondragleave = () => {
      dz.style.borderColor = 'var(--border)';
    };

    dz.ondrop = (e) => {
      e.preventDefault();

      dz.style.borderColor = 'var(--border)';

      const input = document.getElementById('fileInp');

      input.files = e.dataTransfer.files;

      input.dispatchEvent(
        new Event('change')
      );
     };
    }

    function setLanguage(lang) {
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        localStorage.setItem('brimagineLanguage', lang);
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
        });
    }

    // [3] قفل منطقة الرفع فقط لإبقاء النتائج ظاهرة بعد استنفاد 5 محاولات يومية
    function checkUsageLimit() {
        usageData = getUsageData(); // تحديث للتحقق من اليوم الحالي
        if (usageData.count >= 5) {
            const dropZone = document.getElementById('dropZone');
            if (dropZone) {
                dropZone.remove(); // حذف فعلي للمحرك من واجهة المستخدم
            }
            document.getElementById('upgradeArea').style.display = 'block';
        }
    }


    document.getElementById('languageSelect').onchange = (e) => setLanguage(e.target.value);

    document.getElementById('fileInp').onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loader').style.display = 'grid';
        
        try {
            // 1. الفحص التلقائي المبدئي لمعرفة نوع الأبجدية في الصورة
            const detection = await Tesseract.detect(file);
            const script = detection.data.script; 

            // 2. متغير تحديد لغة الـ OCR الافتراضية
            let ocrLang = 'eng'; 

            // 3. خريطة ديناميكية لربط الأبجدية بالـ 16 لغة اللي عندك في الكود
            if (script === 'Arabic') {
                ocrLang = 'ara'; // العربية
            } else if (script === 'Cyrillic') {
                ocrLang = 'rus'; // الروسية
            } else if (script === 'Devanagari') {
                ocrLang = 'hin'; // الهندية
            } else if (script === 'Japanese' || script === 'Han') {
                ocrLang = 'jpn'; // اليابانية
            } else if (script === 'Hangul') {
                ocrLang = 'kor'; // الكورية
            } else if (script === 'Latin') {
                // بما إن باقي اللغات الـ 10 عندك كلها بتشترك في الأبجدية اللاتينية (Latin)،
              // الحل الهندسي الصحيح: حزمة اللاتين الموحدة (ملف واحد خفيف يشمل كل اللغات اللاتينية دون تهنيج)
                ocrLang = 'eng';
            }

            // 4. تشغيل المسح الفعلي باللغة الديناميكية المحددة
            const { data: { text } } = await Tesseract.recognize(file, ocrLang);
           // بقية الكود الأصلي الخاص بك كما هو دون تغيير للنتائج والعداد:
            document.getElementById('ocrResult').value = text;
            document.getElementById('resultsView').style.display = 'grid';
                  window.scrollTo({
          top: document.getElementById('resultsView').offsetTop - 40,
          behavior: 'smooth'
        });
            executeTranslation();

            usageData.count++;
            localStorage.setItem('br_usage_data', JSON.stringify(usageData));
            setTimeout(checkUsageLimit, 1000); 
        } catch (err) {
            console.error("OCR Failure:", err);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    };

    // [5] استخدام الرابط والمنطق المجاني للترجمة الموصى به
    function executeTranslation() {
        const text = document.getElementById('ocrResult').value;
        if(!text.trim()) return;
        
        const target = document.getElementById('targetLanguage').value;
      const translatedBox = document.getElementById('translatedResult');
        
        // ضبط الاتجاه والمحاذاة بناءً على لغة الترجمة المستهدفة (عربي يمين، غيره شمال)
        translatedBox.style.direction = (target === 'ar') ? 'rtl' : 'ltr';
        translatedBox.style.textAlign = (target === 'ar') ? 'right' : 'left';
        const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
        
        fetch(apiUrl, {
            headers: {
                "Accept": "application/json",
                "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
            }
        })
        .then(r => r.json())
        .then(data => {
            const resultText = data[0].map(s => s[0]).join('');
            document.getElementById('translatedResult').value = resultText;
        })
        .catch(err => console.error("Translation Failure:", err));
    }

    async function copyToClipboard(id) {
    const el = document.getElementById(id);

    try {
        await navigator.clipboard.writeText(el.value);
    } catch {
        el.select();
        document.execCommand('copy');
    }

    const lang = localStorage.getItem('brimagineLanguage') || 'en';
    alert(translations[lang].ocr_copied || "Copied!");
}

    window.onload = init;
  
</script>
