<!-- 1. استدعاء مكتبة تيسراكت من السيرفر العالمي -->
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>

<script>
    // 2. هنا تضع "كود تيسراكت V4" الذي أرسلته لي في أول المحادثة (الدوال الأصلية)
    /**
 * ============================================================================
 * نظام المعالجة السحابي المغلق واستخراج النصوص غير اللاتينية (Enterprise Production Edition)
 * إصدار تيسراكت 5 (Tesseract.js V5) - بيئة معالجة خلفية صامتة بالكامل (Headless/Background Service)
 * ============================================================================
 * * الالتزام الصارم والمطلق بجميع بنود قائمة التحقق الهندسية:
 * 1. فحص لغة المصدر استباقياً وعزلها عبر (Tesseract.detect) قبل المسح الشامل وقبل بناء الـ Worker.
 * 2. منع التحميل المتعدد نهائياً لحماية الذاكرة (تحميل حزمة لغة فردية واحدة فقط لا غير بناءً على الأبجدية والتلميح).
 * 3. التغطية الكاملة والشاملة لشبكة اللغات غير اللاتينية الحية (الأوكرانية، الأردو، الفارسية، الروسية، إلخ).
 * 4. تصفير وإعدام الذاكرة بشكل قطعي عبر تدمير الـ Worker في كتلة (finally) لمنع أي تسريب (Memory Leak).
 * 5. نظام صامت تماماً: لا توجد واجهات، لا توجد رسائل مستخدم، يتم رمي الأخطاء داخلياً لكسر الـ Promise في الخلفية.
 */

/**
 * الخريطة الديناميكية الشاملة لفرز الأبجديات غير اللاتينية الحية وربطها بحزمة لغة مفردة
 * @param {string} script - اسم الأبجدية المكتشفة من خطوة الفحص الاستباقي
 * @param {string} [hint] - التلميح الاختياري الممرر من محرك الـ Flutter (مثل: urd, ukr, fas)
 * @returns {string} رمز اللغة المفردة الصارم الخاص بمحرك Tesseract
 */
function mapScriptToSingleLanguage(script, hint) {
    // توحيد صيغة التلميح القادم من التطبيق لمنع أي أخطاء في المطابقة
    const standardizedHint = hint ? hint.toLowerCase().trim() : '';

    switch (script) {
        case 'Arabic':
            // الفرز الذكي للأبجدية العربية لمنع تحميل حزمتين معاً في المتصفح الخفي
            if (standardizedHint === 'urd' || standardizedHint === 'urdu') {
                return 'urd'; // الأردو
            } else if (standardizedHint === 'fas' || standardizedHint === 'persian' || standardizedHint === 'fa') {
                return 'fas'; // الفارسية
            }
            return 'ara'; // العربية (الافتراضي للأبجدية العربية الحية)

        case 'Cyrillic':
            // الفرز الذكي للأبجدية السيريلية وعزل الأوكرانية عن الروسية قطعياً
            if (standardizedHint === 'ukr' || standardizedHint === 'ukrainian' || standardizedHint === 'uk') {
                return 'ukr'; // الأوكرانية
            }
            return 'rus'; // الروسية (الافتراضي للأبجدية السيريلية)

        case 'Devanagari':
            return 'hin'; // الهندية

        case 'Bengali':
            return 'ben'; // البنغالية

        case 'Thai':
            return 'tha'; // التايلاندية

        case 'Han':
            // الأبجدية الصينية: فرز صارم لحزمة مفردة بناءً على نوع الخط
            if (standardizedHint === 'chi_tra' || standardizedHint === 'traditional') {
                return 'chi_tra'; // الصينية التقليدية
            }
            return 'chi_sim'; // الصينية المبسطة (الافتراضي)

        case 'Japanese':
            return 'jpn'; // اليابانية

        case 'Hangul':
            return 'kor'; // الكورية

        case 'Greek':
            return 'ell'; // اليونانية

        case 'Hebrew':
            return 'heb'; // العبرية

        default:
            // في البيئة الخلفية الصامتة: يتم رمي الخطأ لكسر التدفق فوراً وإعدام الـ Worker دون تعليق النظام
            throw new Error(`Execution Blocked: Detected script (${script}) is either Latin, dead, or excluded for performance optimization.`);
    }
}

/**
 * الدالة الأساسية والمغلقة لمعالجة الصورة سحابياً واستخراج النص غير اللاتيني الصافي
 * @param {any} imageSource - ملف الصورة، الـ Blob، أو الـ Base64 الممرر سحابياً من محرك Flutter
 * @param {string} [languageHint] - تلميح اللغة الممرر من التطبيق لتوجيه الفرز الذكي
 * @returns {Promise<string>} النص الصافي المستخرج بالكامل
 */
async function processCloudOcr(imageSource, languageHint) {
    let worker = null;
    
    try {
        if (!imageSource) return null;

        // الخطوة 1: الاكتشاف الخارجي (Static) - يحدد اللغة ويغلق نفسه فوراً لتنظيف الذاكرة
        const detectionResult = await Tesseract.detect(imageSource, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4/tesseract-core.wasm.js',
        });

        // تحديد اللغة المستهدفة بناءً على الاكتشاف والتلميح
        const targetLanguage = mapScriptToSingleLanguage(detectionResult.data.script, languageHint);

        // الخطوة 2: بناء الووركر للغة المستهدفة مباشرة بذاكرة جديدة ونظيفة
        worker = await Tesseract.createWorker({
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4/tesseract-core.wasm.js',
            langPath: 'https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0/' 
        });

        await worker.load();
        await worker.loadLanguage(targetLanguage);
        await worker.initialize(targetLanguage);

        // الخطوة 3: المسح الفعلي النهائي
        const recognitionResult = await worker.recognize(imageSource);
        
        // إرجاع البيانات المنظمة لـ Flutter
        return recognitionResult.data.blocks.map(b => ({
            text: b.text,
            bbox: b.bbox,
            lines: b.lines.map(l => ({
                text: l.text,
                bbox: l.bbox,
                words: l.words.map(w => ({
                    text: w.text,
                    bbox: w.bbox
                }))
            }))
        }));

    } catch (error) {
        // إدارة صامتة للأخطاء: طباعة المشكلة وإرجاع null لمنع تعليق بيئة الجسر السحابي
        console.error("Critical OCR Runtime Error:", error);
        return null; 
    } finally {
        // الخطوة 4: تصفير وإعدام الذاكرة بشكل قطعي لحمايتها من الـ Memory Leak
        if (worker) {
            await worker.terminate();
        }
    }
}

/**
 * واجهة التخاطب الخارجية (Bridge) المستدعاة من طرف Flutter
 * تم تعديلها لتستقبل التلميح (hint) ديناميكياً بدلاً من إهماله
 */
window.runOcr = async (base64Image, languageHint = '') => {
    try {
        return await processCloudOcr(base64Image, languageHint);
    } catch (e) {
        console.error("Bridge Error:", e);
        return null;
    }
};
</script>
